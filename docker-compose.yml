services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: asaas_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - asaas-payment-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asaas_payment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  asaas-payment-postgres: